name: Release to Clojars

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (leave blank to use `git describe --tags --long --always`)'
        required: false
        type: string

permissions:
  contents: write  # manual runs push a git tag matching the released version

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history so git describe / tags resolve

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${{ github.ref_name }}"
          elif [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            # Existing tags are already in describe format (v2-alpha-<n>-g<sha>), so a plain
            # `git describe` would compound suffixes. Continue the scheme arithmetically instead.
            latest="$(git describe --tags --abbrev=0 --match 'v*-*-g*')"
            base="${latest%-*-g*}"                     # v2-alpha
            n="${latest#"$base"-}"; n="${n%%-*}"        # 554
            count="$(git rev-list --count "$latest..HEAD")"
            version="$base-$((n + count))-g$(git rev-parse --short=8 HEAD)"
          fi
          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+-(alpha|beta|rc)-[0-9]+-g[0-9a-f]{7,}$'; then
            echo "Version '$version' does not match v<major>-<maturity>-<n>-g<sha> (e.g. v2-alpha-554-g3b028b1e)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: 1.12.4.1582

      - name: Run JVM tests
        run: ./ci/run_tests_jvm.sh

      - name: Build jar
        run: clojure -T:build jar :version '"${{ steps.version.outputs.version }}"'

      - name: Deploy to Clojars
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: clojure -T:build deploy :version '"${{ steps.version.outputs.version }}"'

      - name: Tag release (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          version="${{ steps.version.outputs.version }}"
          if git show-ref --verify -q "refs/tags/$version"; then
            echo "Tag $version already exists, skipping"
          else
            git tag "$version"
            git push origin "$version"
          fi
